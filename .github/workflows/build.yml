name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: set-projects
        run: |
          # Find directories with CMakeLists.txt, excluding hidden directories
          projects=$(find . -maxdepth 2 -name "CMakeLists.txt" -printf '%h\n' | jq -R . | jq -s -c .)
          echo "projects=$projects" >> $GITHUB_OUTPUT

  build:
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'

      - name: Configure CMake
        run: cmake -B ${{ matrix.project }}/build -S ${{ matrix.project }}

      - name: Build
        run: cmake --build ${{ matrix.project }}/build --config Release
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.project }}
          path: ${{ matrix.project }}/build

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
