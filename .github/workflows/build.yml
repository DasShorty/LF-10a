name: Build

on:
  push:
    branches:
      - main

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: set-projects
        run: |
          # Find directories with CMakeLists.txt, excluding hidden directories
          projects=$(find . -maxdepth 2 -name "CMakeLists.txt" -printf '%h\n' | jq -R . | jq -s -c .)
          echo "projects=$projects" >> $GITHUB_OUTPUT

  build:
    needs: discover
    if: startsWith(github.event.head_commit.message, 'build:')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'

      - name: Configure CMake
        run: cmake -B ${{ matrix.project }}/build -S ${{ matrix.project }}

      - name: Build
        run: cmake --build ${{ matrix.project }}/build --config Release
